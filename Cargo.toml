[package]
name = "json-objects-to-csv"
version = "0.1.3"
edition = "2021"
authors = ["Vicent Selfa <vtselfa@gmail.com>"]
description = "Robust Rust library for converting JSON objects into CSV rows"
repository = "https://github.com/vtselfa/json-objects-to-csv"
license = "MIT"
readme = "README.md"
keywords = ["json", "csv", "convert", "flatten", "serde"]
categories = ["encoding"]

[dependencies]
csv = "1"
flatten-json-object = "0.6"
serde_json = { version = "1", features = ["preserve_order"] }
tempfile = "3"
thiserror = "2"

[dev-dependencies]
rstest = "0.25"
